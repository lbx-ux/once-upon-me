# ── 服务器那一档（SPRING_PROFILES_ACTIVE=prod）─────────────────────────────
#
# ★ 这个文件里**一个秘密都没有**：库的口令、JWT 密钥、阿里云 AccessKey 全在
#   `/etc/xiaozhujue/api.yml`（600 权限），由 systemd 用
#   `--spring.config.additional-location=` 挂进来。
#   理由与仓库那条"真实密钥只写 .env.local"是同一条：这个仓库是公开的。
#
# ★ 连的是 127.0.0.1：MySQL 与 Java 在同一台机器上，所以这一跳从不离开回环。
#   正因如此 `useSSL=false` 才是可接受的——它没有经过任何一段网线。
#   哪天数据库搬到另一台机器，这两行要一起改（SSL 与防火墙）。
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/xiaozhujue?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${APP_DB_USER}
    password: ${APP_DB_PASSWORD}
    hikari:
      # 2C2G 的机器上，连接池开大只是把内存分给等待。这一档的并发是"几个人在点"
      maximum-pool-size: 6
      minimum-idle: 1

app:
  sms:
    # ★ 生产默认**真发**。要临时停掉（比如演示当天不想花钱），在 /etc/xiaozhujue/api.yml
    #   里写 APP_SMS_ENABLED=false，而不是改这里
    enabled: true
